<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Document</title>
</head>
<body>
    <div class = "login">
        <img src="logo.png" alt="Logo do IFRJ campus Niteroi">
        <div class = "info">
            <p>Agora o acesso é feito com seu <strong>CPF + senha</strong></p>
        </div>
        <div class = "usuario">
            <input type="number" name="user" placeholder= "CPF (só números)">
            <input type="password" name="senha" placeholder= "Senha">
        </div>
        <button type="submit">Confirmar</button>
        <div class = "links">
            <a href="#">Esqueci a senha</a>
            <a href="#">Esqueci o E-mail Cadastrado</a>
            <a href="#">Primeiro acesso</a>
        </div>
    </div>
</body>
</html>
